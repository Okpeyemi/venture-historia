services:
  postgres:
    image: postgres:16-alpine
    container_name: venture_historia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: venture
      POSTGRES_PASSWORD: venture_dev_password
      POSTGRES_DB: venture_historia
    ports:
      # Host port 5433 (not 5432) to avoid conflict with system Postgres
      - "5433:5432"
    volumes:
      - venture_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venture -d venture_historia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venture_postgres_data:
